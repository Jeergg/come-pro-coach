<style>

}

:root[data-theme="dark"]{

  --brand:#9be83f;--brand-text:#9be83f;--brand-soft:#16240f;--on-brand:#0f1f08;--warn:#ffc23d;--warn-soft:#2b2208;--bad:#ef7a7a;--bad-soft:#2e1414;--ok:#9be83f;color-scheme:dark;}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:18px 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.coach{display:flex;gap:10px;align-items:center}
.logo{width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800}
.coach small{display:block;color:var(--muted);font-size:12px}
.coach b{font-size:15px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:17px;font-weight:700;margin:26px 0 10px}
.sub{color:var(--muted);margin-top:4px}
.summary{display:flex;gap:8px;margin-top:16px;overflow-x:auto}
.chip{flex:none;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:13px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface2)}
.ring{flex:none;position:relative;width:46px;height:46px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:14px}
.grow{flex:1;min-width:0}
.name{font-weight:700}
.meta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.t-warn{background:var(--warn-soft);color:var(--warn)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-ok{background:var(--brand-soft);color:var(--brand-text)}
.act{flex:none;font-size:13px;font-weight:700;color:var(--brand-text);padding:8px 10px;border-radius:10px;background:var(--brand-soft)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin:14px 0 10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{padding:10px 0 12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--brand-text)}
nav.tabs svg{width:22px;height:22px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--brand-text);font-weight:700;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:20px;font-weight:800}
.stat small{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.note{border-left:4px solid var(--warn);border-radius:0;background:var(--warn-soft);padding:10px 12px;font-size:14px;margin-top:12px}
.days{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:10px}
.days i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.days i.y{background:var(--brand)}.days i.n{background:var(--bad)}
.meal{padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal h3{font-size:14px;font-weight:700;margin-bottom:6px}
.foods{display:flex;flex-wrap:wrap;gap:6px}
.food{padding:6px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600}
.food.changed{border-color:var(--brand);color:var(--brand-text);background:var(--brand-soft)}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
.ck{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px}
.ck div{background:var(--surface2);border-radius:10px;padding:9px 10px}
.ck small{display:block;color:var(--muted);font-size:12px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:31;transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:none}
.sheet h3{font-size:18px;font-weight:800}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0}
.seg button{padding:10px 6px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-align:left}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt small{color:var(--muted);font-size:12px;display:block}
.primary{width:100%;padding:14px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-weight:800;margin-top:8px}
.primary:disabled{opacity:.4}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:40;width:max-content;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:14px;overflow:hidden}
.panel summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;cursor:pointer}
.panel summary::-webkit-details-marker{display:none}
.panel summary small,.switch-row small,.ex small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.chev{font-size:20px;color:var(--muted);transition:transform .2s}
.panel[open] .chev{transform:rotate(180deg)}
.pbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 6px}
.kpis div{background:var(--surface2);border-radius:12px;padding:10px}
.kpis small{display:block;color:var(--muted);font-size:12px}
.kpis b{font-size:18px;font-weight:800}
.mac{margin-top:10px}.mac-h{display:flex;justify-content:space-between;font-size:13px}
.daychips{display:flex;gap:6px;overflow-x:auto;margin-top:16px;padding-bottom:4px}
.dchip{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:13px;font-weight:700}
.dchip.past{color:var(--muted)}.dchip.today{border:2px solid var(--brand)}
.dchip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.meal h3 small{color:var(--muted);font-weight:600;font-size:12px;margin-left:4px}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.switch{flex:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--brand)}.switch[aria-checked="true"] i{transform:translateX(20px)}
.rday{font-size:14px;font-weight:800;margin:16px 0 6px;display:flex;justify-content:space-between}
.rday small{color:var(--muted);font-weight:600}
.ex{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--surface2)}
.ex .sr{flex:none;font-weight:800;color:var(--brand-text)}
.off{opacity:.45}
.sheet{max-height:88vh;overflow-y:auto}
.steprow{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-weight:700}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand-text);font-size:20px;font-weight:800}
.seg.reps{grid-template-columns:repeat(4,1fr)}
.rowwrap{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.rowwrap:last-child{border-bottom:0}
.rowwrap .row{border-bottom:0;flex:1;min-width:0}
.rowwrap .wabtn{margin-right:12px}
.wabtn{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text)}
.wabtn svg{width:20px;height:20px}
.iconbtn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.hist{list-style:none;padding:0;margin:12px 0 0}
.hist li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist li:last-child{border-bottom:0}
.hdot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--muted)}
.h-peso{background:var(--brand)}.h-plan{background:var(--warn)}.h-pago{background:var(--ink)}.h-whatsapp{background:var(--brand-text);box-shadow:0 0 0 2px var(--brand-soft)}
.dgrid{margin-top:12px}
.msglist{list-style:none;padding:0;margin:10px 0 0}

.bubble .hora{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:4px}
.bubble.img{height:110px;width:88%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text);font-weight:700;border-radius:14px;text-align:center}
textarea.search{font:inherit}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ghost{display:block;text-align:center;padding:11px 8px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;background:var(--surface2)}
.linkbtn{margin-top:10px;font-size:13px;color:var(--muted);text-decoration:underline}
.linkbox{margin-top:10px;padding:12px;border-radius:12px;background:var(--surface2);font-weight:700;word-break:break-all}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.form .search{margin:6px 0 0}.form .seg{margin:6px 0 0}.form .opt{margin-top:6px;margin-bottom:0}
.form .err{font-size:13px;margin-top:4px}
.addbtn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--on-brand);font-size:26px;font-weight:700;line-height:1}
.cobro{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.lbl{display:block;font-weight:700;font-size:14px;margin-top:14px}
.err{color:var(--bad);font-weight:600}
@media (prefers-reduced-motion:reduce){.sheet,.toast,.switch,.switch i,.chev{transition:none}}
nav.tabs button[hidden]{display:none}
.kgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
.kgrid .card{margin:0;padding:12px 14px}
.kgrid small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kgrid b{font-size:20px}
</style>
</head>

/*
  Elige el mensaje del día para un cliente sin repetir.
  cliente: { nombre, diaPlan (1-30 del primer plan), usados: [ids ya enviados] }
  ctx: { fecha: Date, entrena: bool, evento: null | 'estancamiento' | 'regreso' | nombre de logro }
  Devuelve { id, texto } y agrega el id a cliente.usados (guárdalo en Supabase).
*/
function elegirMensaje(cliente, ctx) {
  const usados = new Set(cliente.usados || []);
  const libres = (cat) => {
    const lista = MENSAJES[cat] || [];
    return lista
      .map((m, i) => ({ id: `${cat}-${i}`, texto: typeof m === "string" ? m : m.texto, evento: m.evento }))
      .filter((m) => !usados.has(m.id));
  };

  // Orden de prioridad: evento > inicio > tipo de día > general
  const orden = [];
  if (ctx.evento === "estancamiento" || ctx.evento === "regreso") orden.push(libres(ctx.evento));
  else if (ctx.evento) orden.push(libres("logro").filter((m) => m.evento === ctx.evento));
  if (cliente.diaPlan && cliente.diaPlan <= 10 && !(cliente.usados || []).some((id) => id.startsWith("general"))) {
    orden.push(libres("inicio").slice(0, 1));
  }
  const dia = ctx.fecha.getDay(); // 0 domingo, 1 lunes, 6 sábado
  if (dia === 1) orden.push(libres("lunes"));
  if (dia === 0 || dia === 6) orden.push(libres("finde"));
  if (!ctx.entrena && dia !== 0 && dia !== 6) orden.push(libres("descanso"));
  orden.push(libres("general"));

  let elegido = null;
  for (const lista of orden) {
    if (lista.length) {
      elegido = lista[Math.floor(Math.random() * lista.length)];
      // Inicio va en orden, no al azar
      if (lista[0].id.startsWith("inicio")) elegido = lista[0];
      break;
    }
  }

  // Si ya se usaron todos los generales (más de 4 meses), se reinicia el ciclo
  if (!elegido) {
    cliente.usados = (cliente.usados || []).filter((id) => !id.startsWith("general"));
    return elegirMensaje(cliente, ctx);
  }

  cliente.usados = [...(cliente.usados || []), elegido.id];
  return { id: elegido.id, texto: elegido.texto.replaceAll("{nombre}", cliente.nombre) };
}

/* Punto de integración: en producción este objeto se reemplaza por motor.js con los motores reales de COME PRO
   (cálculo calórico, recetas, scaleDayToTarget, lista de compras, presupuesto y rutinas). Aquí solo estima calorías para la demo. */
const ComeProMotor={
 generarPlan(d){
  const tmb=10*d.peso+6.25*d.altura-5*d.edad+(d.sexo==='h'?5:-161);
  const tdee=Math.round(tmb*{sed:1.2,lig:1.375,mod:1.55,alt:1.725}[d.act]/10)*10;
  const kcal=Math.round(tdee*(1+{grasa:-0.2,musculo:0.12,mant:0}[d.obj])/10)*10;
  const p=Math.round(d.peso*(d.obj==='mant'?1.6:1.8));
  const g=Math.round(kcal*0.27/9);
  const c=Math.max(0,Math.round((kcal-p*4-g*9)/4));
  return {kcal,tdee,p,c,g};
 }
};

}

const planReal={};let motorFrame=null,generando={};
const pausa=ms=>new Promise(r=>setTimeout(r,ms));
async function esperarQue(fn,ms,msg){const t0=Date.now();while(Date.now()-t0<ms){try{const v=fn();if(v)return v}catch(e){}await pausa(250)}throw new Error(msg)}
function abrirMotor(aviso){return new Promise((ok,mal)=>{
 if(motorFrame)motorFrame.remove();
 motorFrame=document.createElement('iframe');motorFrame.src='motor.html?v='+Date.now().toString(36).slice(0,5);motorFrame.title='Motor COME PRO';
 motorFrame.setAttribute('aria-hidden','true');motorFrame.tabIndex=-1;
 motorFrame.style.cssText='position:fixed;left:-10000px;top:0;width:390px;height:844px;border:0;opacity:0;pointer-events:none';
 // No se espera a que carguen todas las imágenes de COME PRO (en el iPhone puede tardar minutos):
 // en cuanto el formulario y el motor existen, se sigue.
 const t0=Date.now();let listo=false;
 const fin=(f,v)=>{if(listo)return;listo=true;clearInterval(iv);f(v)};
 const iv=setInterval(()=>{
  let w=null;try{w=motorFrame.contentWindow;const d=w.document;
   if(d&&d.location.href!=='about:blank'&&d.getElementById('dietForm')&&w.ComeProGetPlan)return fin(ok,w);
   if(d&&d.readyState==='complete'&&d.location.href!=='about:blank'&&!d.getElementById('dietForm')&&Date.now()-t0>3000)
    return fin(mal,new Error('No se encontró COME PRO en motor.html. Revisa que motor.html esté subido en el repositorio come-pro-coach.'));
  }catch(e){return fin(mal,new Error('El motor debe estar en la misma web que el panel (motor.html).'))}
  const s=Math.round((Date.now()-t0)/1000);if(s>=8)aviso(`Abriendo COME PRO… (${s} s)`);
  if(Date.now()-t0>120000)fin(mal,new Error('COME PRO tardó demasiado en abrir. Revisa tu internet e intenta otra vez.'));
 },400);
 motorFrame.onerror=()=>fin(mal,new Error('No se pudo abrir COME PRO.'));
 document.body.appendChild(motorFrame)})}
function unidadTxt(u){u=String(u||'');let m;
 if(u==='unidad')return 'ud.';if(u==='unidad_grande')return 'ud. grande';if(u==='lb'||u==='kg')return u;
 if((m=u.match(/^paquete(\d+)(g|kg|ml)?$/)))return 'paq. de '+m[1]+' '+(m[2]||'g');

function cargarImg(src,cors,ms){return new Promise(ok=>{const im=new Image();if(cors)im.crossOrigin='anonymous';const t=setTimeout(()=>ok(null),ms||8000);im.onload=()=>{clearTimeout(t);ok(im.naturalWidth?im:null)};im.onerror=()=>{clearTimeout(t);ok(null)};im.src=src})}
const fuentes={};let yaSubidas;
// Busca (una vez) en qué repositorio y carpeta están las fotos, probando con un número que sí existe
async function buscarFuente(tipo,carpetas,n){
 if(fuentes[tipo]!==undefined)return fuentes[tipo];
 try{const g=JSON.parse(localStorage.getItem('cpFuente_'+tipo)||'null');if(g&&await cargarImg(g.base+n+'.'+g.ext,true,8000))return fuentes[tipo]=g}catch(e){}
 for(const r of REPOS())for(const c of carpetas)for(const e of EXTS){
  if(await cargarImg(r+c+n+'.'+e,true,6000)){fuentes[tipo]={base:r+c,ext:e};try{localStorage.setItem('cpFuente_'+tipo,JSON.stringify(fuentes[tipo]))}catch(x){}return fuentes[tipo]}}

function aJpg(im,max){const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement('canvas');cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);

async function subirFoto(tipo,f,n){
 const ruta=`repo/${tipo}/${n}.jpg`;if(yaSubidas.has(ruta))return fotoPublica(ruta);
 let im=await cargarImg(f.base+n+'.'+f.ext,true,10000);
 for(const e of EXTS){if(im)break;if(e!==f.ext)im=await cargarImg(f.base+n+'.'+e,true,8000)}   // por si alguna foto tiene otra extensión
 if(!im)return null;
 const blob=await aJpg(im,1280);if(!blob)return null;
 const {error}=await sb.storage.from('fotos').upload(ruta,blob,{contentType:'image/jpeg',upsert:false,cacheControl:'31536000'});
 if(error&&!/exist|duplicate|409/i.test(error.message||''))return null;
 yaSubidas.add(ruta);return fotoPublica(ruta);
}
async function subirVarias(tipo,f,nums){const urls={};for(let i=0;i<nums.length;i+=6)await Promise.all(nums.slice(i,i+6).map(async n=>{try{urls[n]=f?await subirFoto(tipo,f,n):null}catch(e){urls[n]=null}}));return urls}

const ALIM={};CATALOGO.foods.forEach(([id,n,cat,kcal,p,cc,f,unit,g])=>{ALIM[id]={id,n,cat,kcal,p,c:cc,f,unit,g}});
const EJS=CATALOGO.ex.map(([id,n,grupo,m,equip,fn])=>({id,n,grupo,m,equip,fn}));
const GRUPO_TXT={pecho:'Pecho',espalda:'Espalda',hombros:'Hombros',brazos:'Brazos',piernas:'Piernas',gluteos:'Glúteos',core:'Core',completo:'Cuerpo completo',cuello:'Cuello'};
function cantTxt(id,g){const f=ALIM[id];if(f&&/^unidad/.test(f.unit)&&f.g){const u=Math.max(1,Math.round(g/f.g));return u+(u===1?' unidad':' unidades')}return Math.round(g)+' g'}
function macrosDe(items){return items.reduce((a,x)=>{const f=ALIM[x.id];if(!f||!x.g)return a;const k=x.g/100;a.kcal+=f.kcal*k;a.p+=f.p*k;a.c+=f.c*k;a.f+=f.f*k;return a},{kcal:0,p:0,c:0,f:0})}
const editable=P=>P&&P.dias.every(d=>d.comidas.every(m=>m.items.every(x=>x.id&&x.g)));
// Recalcula calorías, macros y compras del día con los gramos nuevos
function recalcularDia(P,d){
 const todo=d.comidas.flatMap(m=>m.items),t=macrosDe(todo);
 d.kcal=Math.round(t.kcal);d.p=Math.round(t.p);d.c=Math.round(t.c);d.g=Math.round(t.f);
 const prec=(P.resumen&&P.resumen.precios)||{},por={};
 todo.forEach(x=>{por[x.id]=(por[x.id]||0)+x.g});
 const viejo={};(d.compra||[]).forEach(x=>{viejo[x.id]=x});
 d.compra=Object.keys(por).map(id=>{const f=ALIM[id]||{},v=viejo[id]||{};return {id,n:f.n||v.n||id,u:+(por[id]/(f.g||100)).toFixed(4),unit:f.unit||v.unit||'g',price:prec[id]!=null?prec[id]:(v.price||0)}});
}
// Lista de compras por semana a partir de lo que lleva cada día
function recalcularCompras(P){
 const rangos=[[0,7],[7,14],[14,21],[21,P.dias.length]];
 P.compras=rangos.map(([a,b],i)=>{const tot={};
  P.dias.slice(a,b).forEach(d=>(d.compra||[]).forEach(x=>{const t=tot[x.id]||(tot[x.id]={n:x.n,unit:x.unit,u:0,sub:0});t.u+=x.u;t.sub+=x.u*(x.price||0)}));
  const items=Object.values(tot).map(x=>({n:x.n,cant:/^(lb|kg)$/.test(x.unit)?Math.ceil(x.u*2)/2:Math.max(1,Math.ceil(x.u-0.05)),unidad:unidadTxt(x.unit),sub:Math.round(x.sub)}));
  return {semana:i+1,dias:(a+1)+'–'+b,total:Math.round(items.reduce((s,x)=>s+x.sub,0)),items}});
 P.resumen.costoMes=P.compras.reduce((s,x)=>s+x.total,0);
}
async function guardarPlanEditado(c,P,que){
 try{await guardarPlanServidor(c,{cliente_id:c.id,kcal:P.kcal||P.resumen.kcal,dias:P.dias,compras:P.compras,rutina:P.rutina,resumen:P.resumen})}
 catch(e){toast(e.message);return false}
 planReal[c.id]=P;log(c,'plan',que);toast('Guardado ✅ Se usa en los próximos envíos');return true;
}

/* --- Editar una comida --- */
function abrirComida(c,di,mi){
 const P=planReal[c.id],d=P.dias.find(x=>x.dia===di),m=d.comidas[mi];
 if(!editable(P)){toast('Este plan se generó con una versión anterior. Regenéralo con COME PRO para poder editarlo.');return}
 const orig=Math.round(macrosDe(m.items).kcal),clave=m.nombre+'|'+(m.plato||'');
 let items=m.items.map(x=>({...x})),plato=m.plato||'',prep=m.prep||'',todos=false;
 const sh=$('#sheet');
 const pintar=()=>{const t=macrosDe(items);
  sh.innerHTML=`<h3>${esc(m.nombre)} · día ${di}</h3>
  <label class="lbl" for="edPlato">Nombre del plato</label><input class="search" id="edPlato" value="${esc(plato)}" style="margin:6px 0 0">
  <span class="lbl">Ingredientes</span>
  ${items.map((x,i)=>`<div style="display:flex;gap:8px;align-items:center;margin:6px 0"><span class="grow" style="font-weight:600">${esc(x.n)}</span><input class="search" type="number" inputmode="numeric" data-g="${i}" value="${Math.round(x.g)}" aria-label="Gramos de ${esc(x.n)}" style="width:84px;margin:0;padding:10px"><span class="meta">g</span><button type="button" class="ghost" data-q="${i}" aria-label="Quitar ${esc(x.n)}" style="width:auto;padding:8px 12px;margin:0">✕</button></div>`).join('')||'<p class="hint">Sin ingredientes.</p>'}
  <div style="display:flex;gap:8px;margin-top:10px;align-items:center"><select class="search" id="edNuevo" style="margin:0;flex:1"><option value="">+ Agregar alimento…</option>${Object.values(ALIM).filter(f=>!items.some(x=>x.id===f.id)).sort((a,b)=>a.n.localeCompare(b.n,'es')).map(f=>`<option value="${f.id}">${esc(f.n)}</option>`).join('')}</select><input class="search" type="number" inputmode="numeric" id="edNuevoG" value="100" aria-label="Gramos" style="width:76px;margin:0;padding:10px"><button type="button" class="ghost" id="edAgregar" style="width:auto;margin:0;padding:8px 12px">Agregar</button></div>
  <div class="card" style="margin-top:12px"><b>${Math.round(t.kcal)} kcal</b> · ${Math.round(t.p)} g proteína · ${Math.round(t.c)} g carbohidratos · ${Math.round(t.f)} g grasa${Math.abs(t.kcal-orig)>15?`<p class="hint" style="margin:4px 0 0">Antes: ${orig} kcal.</p>`:''}
   <button type="button" class="ghost" id="edAjustar" style="margin-top:8px">Ajustar porciones a ${orig} kcal</button></div>
  <label class="lbl" for="edPrep">Cómo se prepara</label><textarea class="search" id="edPrep" rows="4" style="font:inherit;resize:vertical;margin:6px 0 0">${esc(prep)}</textarea>
  <label class="acepto" style="margin-top:12px"><input type="checkbox" id="edTodos" ${todos?'checked':''}><span>Aplicar también en los otros días que tienen "${esc(m.plato||m.nombre)}"</span></label>
  <button class="primary" id="edGuardar">Guardar cambios</button>`;
  $('#edPlato').oninput=e=>plato=e.target.value;$('#edPrep').oninput=e=>prep=e.target.value;$('#edTodos').onchange=e=>todos=e.target.checked;
  sh.querySelectorAll('[data-g]').forEach(inp=>inp.onchange=()=>{items[+inp.dataset.g].g=Math.max(0,Math.round(+inp.value||0));pintar()});
  sh.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.q,1);pintar()});
  $('#edAgregar').onclick=()=>{const id=$('#edNuevo').value,g=Math.max(1,+$('#edNuevoG').value||100);if(!id){toast('Elige un alimento');return}items.push({id,g,n:ALIM[id].n,c:''});pintar()};
  // El "motor": escala todas las porciones para que la comida vuelva a sus calorías
  $('#edAjustar').onclick=()=>{const k=macrosDe(items).kcal;if(!k){toast('Agrega ingredientes');return}const f=orig/k;items.forEach(x=>{x.g=Math.max(1,Math.round(x.g*f))});pintar();toast('Porciones ajustadas')};
  $('#edGuardar').onclick=async()=>{
   const b=$('#edGuardar');b.disabled=true;b.textContent='Guardando…';
   const nuevos=items.filter(x=>x.g>0).map(x=>({id:x.id,g:x.g,n:x.n,c:cantTxt(x.id,x.g)}));
   const aplicar=mm=>{mm.items=nuevos.map(x=>({...x}));mm.texto=mm.items.map(x=>x.n+' ('+x.c+')').join(', ');mm.plato=plato.trim();mm.prep=prep.trim()};
   const tocados=[];
   P.dias.forEach(dd=>dd.comidas.forEach(mm=>{if(mm===m||(todos&&mm.nombre+'|'+(mm.plato||'')===clave)){aplicar(mm);if(!tocados.includes(dd))tocados.push(dd)}}));
   tocados.forEach(dd=>recalcularDia(P,dd));recalcularCompras(P);
   if(await guardarPlanEditado(c,P,`Editaste ${m.nombre.toLowerCase()} del día ${di}${tocados.length>1?' y de otros '+(tocados.length-1)+' días':''}`)){cerrar();renderCliente(c)}
   else{b.disabled=false;b.textContent='Guardar cambios'}};
 };
 pintar();abrirSheet();
}

function comprasVisibles(P,sem){
 const q=new Set(((P.resumen&&P.resumen.comprasQuitar)||[]).map(x=>String(x).toLowerCase()));
 return [...sem.items.filter(x=>!q.has(String(x.n).toLowerCase())),...(((P.resumen&&P.resumen.comprasExtra)||[]).map(x=>({...x,extra:true,sub:0})))];
}
async function quitarCompra(c,n){
 const P=planReal[c.id];P.resumen.comprasQuitar=[...new Set([...(P.resumen.comprasQuitar||[]),n])];
 if(await guardarPlanEditado(c,P,`Quitaste "${n}" de la lista de compras`))renderCliente(c);
}
async function quitarExtra(c,i){
 const P=planReal[c.id],x=(P.resumen.comprasExtra||[])[i];if(!x)return;P.resumen.comprasExtra.splice(i,1);
 if(await guardarPlanEditado(c,P,`Quitaste "${x.n}" de la lista de compras`))renderCliente(c);
}
async function restaurarCompras(c){
 const P=planReal[c.id];P.resumen.comprasQuitar=[];

/* --- Rutina: cambiar, agregar o quitar ejercicios desde la biblioteca de COME PRO --- */
function fotoLib(fn){const f=fuentes.ejercicios;if(f===undefined){try{const g=JSON.parse(localStorage.getItem('cpFuente_ejercicios')||'null');if(g)return g.base+String(fn).replace(/\.\w+$/,'')+'.'+g.ext}catch(e){}return ''}return f?f.base+String(fn).replace(/\.\w+$/,'')+'.'+f.ext:''}
async function fotoEjercicio(fn){
 const n=parseInt(fn,10);if(!n)return null;
 if(!yaSubidas){yaSubidas=new Set();try{const {data}=await sb.storage.from('fotos').list('repo/ejercicios',{limit:1000});(data||[]).forEach(x=>yaSubidas.add('repo/ejercicios/'+x.name))}catch(e){}}
 const f=await buscarFuente('ejercicios',CARP_EJ,n);return f?await subirFoto('ejercicios',f,n):null;
}
function abrirEj(c,ri,ei){
 const P=planReal[c.id],r=P.rutina[ri],e=ei==null?null:r.ejercicios[ei];
 let sel=e?(EJS.find(x=>x.id===e.id)||EJS.find(x=>x.n===e.n)||null):null,filtro='',grupo='';
 let s=e?e.s:3,rep=e?e.r:'8-12',des=e?(e.d||''):'90 s';
 const sh=$('#sheet');
 const lista=()=>{const L=EJS.filter(x=>(!grupo||x.grupo===grupo)&&(!filtro||(x.n+' '+x.m+' '+x.equip).toLowerCase().includes(filtro.toLowerCase()))).slice(0,60);
  $('#exLista').innerHTML=L.map(x=>{const img=fotoLib(x.fn);return `<button type="button" class="row" data-pick="${esc(x.id)}" style="${sel&&sel.id===x.id?'border-color:var(--brand);background:var(--soft)':''}">${img?`<img src="${esc(img)}" alt="" loading="lazy" style="width:44px;height:44px;object-fit:cover;border-radius:8px;flex:none">`:''}<div class="grow"><div class="name" style="font-size:15px">${esc(x.n)}</div><div class="meta">${esc(x.m)}${x.equip?' · '+esc(x.equip):''}</div></div></button>`}).join('')||'<p class="hint">No hay ejercicios con esa búsqueda.</p>';
  $('#exLista').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{sel=EJS.find(x=>x.id===b.dataset.pick);pintar()})};
 const pintar=()=>{

  <div class="summary" style="flex-wrap:wrap">${['',...Object.keys(GRUPO_TXT)].map(g=>`<button type="button" class="chip" data-grupo="${g}" style="${grupo===g?'background:var(--brand);color:var(--on-brand)':''}">${g?GRUPO_TXT[g]:'Todos'}</button>`).join('')}</div>
  <div class="list" id="exLista" style="max-height:38vh;overflow-y:auto;margin-top:8px"></div>
  <button class="primary" id="exGuardar">${e?'Guardar cambios':'Agregar a la rutina'}</button>

  $('#exS').oninput=x=>s=x.target.value;$('#exR').oninput=x=>rep=x.target.value;$('#exD').oninput=x=>des=x.target.value;

async function generarConMotor(c,aviso){
 const d=c.datos||{};aviso=aviso||(()=>{});
 if(d.cond==='embarazo')throw new Error('Por embarazo o lactancia, este plan debe armarlo el entrenador junto a su médico.');
 aviso('Abriendo COME PRO…');
 const w=await abrirMotor(aviso);let doc;
 try{doc=w.document}catch(e){throw new Error('El motor debe estar en la misma web que el panel (motor.html).')}
 await esperarQue(()=>doc.getElementById('dietForm')&&w.ComeProGetPlan,30000,'No se encontró el formulario de COME PRO en motor.html.');
 await pausa(600);
 aviso('Calculando calorías y comidas…');
 const set=(id,v)=>{const e=doc.getElementById(id);if(!e)return;e.value=v;e.dispatchEvent(new w.Event('input',{bubbles:true}));e.dispatchEvent(new w.Event('change',{bubbles:true}))};
 const seg=(id,v)=>{const g=doc.getElementById(id);if(g)g.querySelectorAll('.seg-btn').forEach(x=>x.classList.toggle('active',x.dataset.val===String(v)))};
 const goal={grasa:'cut',musculo:'bulk',mant:'recomp'}[objKey[c.obj]||'grasa']||'cut';
 const dias=Math.max(2,Math.min(6,+d.dias||3)),peso=c.peso.at(-1)||70;
 try{w.eval("unitWeight='kg';unitHeight='cm'")}catch(e){}
 set('pais',d.pais||'DO');try{w.applyLanguage('es',true)}catch(e){}set('nombre',limpiar(c.n.split(' ')[0])||'Cliente');set('edad',d.edad||30);set('peso',peso);set('altura',d.altura||165);
 set('diasEntreno',dias);set('minutosSesion',60);set('embarazo','no');
 set('condicion',{ninguna:'ninguna',diabetes:'diabetes',hta:'hipertension',otra:'otra'}[d.cond]||'ninguna');
 seg('sexoSeg',d.sexo==='h'?'hombre':'mujer');seg('actSeg',{sed:'1.2',lig:'1.375',mod:'1.55',alt:'1.725'}[d.act]||'1.375');
 seg('goalSeg',goal);seg('ritmoSeg','moderado');seg('tipoSeg','pesas');seg('intensidadSeg','moderada');
 // Alimentos que no come: se buscan en la base de COME PRO por nombre
 try{const toks=String(d.no||'').toLowerCase().split(/[,;\n]| y /).map(t=>t.trim()).filter(t=>t.length>2);
  if(toks.length){const ids=Object.keys(w.eval('FOODS')).filter(id=>{const n=String(w.foodName(id)).toLowerCase();return toks.some(t=>n.includes(t)||id.toLowerCase().includes(t))});const ex=w.eval('customExcluded');ids.forEach(id=>{if(!ex.includes(id))ex.push(id)})}}catch(e){}
 try{w.ComeProSetPlan(null)}catch(e){}
 w.COME_PRO_GENERATING=false;
 doc.getElementById('dietForm').requestSubmit();
 let P=null;
 for(let i=0;i<120&&!P;i++){
  await pausa(500);
  const b=[...doc.querySelectorAll('button,a')].find(x=>/continuar a mi dieta|continuar sin suplementos/i.test(x.textContent)&&x.offsetParent);if(b)b.click();
  const er=doc.getElementById('generationError');if(er&&!er.classList.contains('hidden')&&er.textContent.trim())throw new Error('COME PRO: '+er.textContent.trim());
  const p=w.ComeProGetPlan();if(p&&p.culinaryDays&&p.culinaryDays.length)P=p;
 }
 if(!P)throw new Error('COME PRO no terminó el plan. Intenta otra vez.');
 aviso('Armando lista de compras y rutina…');
 const FOODS=w.eval('FOODS'),nm=id=>{try{return w.foodName(id)}catch(e){return id}};
 const cant=(id,g)=>{const f=FOODS[id];if(f&&f.unit==='unidad'&&f.gPerUnit){const u=Math.max(1,Math.round(g/f.gPerUnit));return u+(u===1?' unidad':' unidades')}return Math.round(g)+' g'};
 const MEALS=[['desayuno','Desayuno'],['almuerzo','Almuerzo'],['merienda','Merienda'],['cena','Cena']];
 const amt=it=>{try{const t=w.eval('culinaryAmountText')(it);if(t)return t}catch(e){}return cant(it.id,it.g)};
 const plato=(k,items)=>{try{const d=w.eval('culinaryDishFor')(k,items);return d&&d.name?{n:String(d.name),p:String(d.prep||'')}:null}catch(e){return null}};
 const escena=(k,items)=>{try{const sc=w.cpRecipeScene&&w.cpRecipeScene(k,items);return sc?+sc[0]:null}catch(e){return null}};
 const diasPlan=P.culinaryDays.map((cd,i)=>{const t=cd.totals||{},base=P.days[i]||{},tm=cd.tmpl||{};
  const comidas=MEALS.map(([k,l])=>{const crudo=(tm[k]||[]).filter(x=>x&&x.g>0&&x.id!=='sal'),items=crudo.map(x=>({id:x.id,g:Math.round(x.g),n:nm(x.id),c:amt(x)})),pl=crudo.length?plato(k,crudo):null;
   return {k,nombre:l,plato:pl?pl.n:'',prep:pl?pl.p:'',foto:crudo.length?escena(k,crudo):null,items,texto:items.map(x=>x.n+' ('+x.c+')').join(', ')}}).filter(m=>m.items.length);
  let compra=[];try{compra=w.buildPurchaseForDays(P,[cd]).map(x=>({id:x.id,n:x.name,u:+(x.unitsNeeded||0).toFixed(4),unit:x.unit,price:x.price||0}))}catch(e){}
  return {dia:i+1,entreno:!!base.isTrainingDay,kcal:Math.round(t.kcal||0),p:Math.round(t.p||0),c:Math.round(t.c||0),g:Math.round(t.f||0),comidas,compra,condimentos:(tm.condimentos||[]).map(x=>nm(x.id))}});
 const rangos=[[0,7],[7,14],[14,21],[21,P.culinaryDays.length]];
 const compras=rangos.map(([a,b],i)=>{const L=w.buildPurchaseForDays(P,P.culinaryDays.slice(a,b));
  return {semana:i+1,dias:(a+1)+'–'+b,total:Math.round(L.reduce((s,x)=>s+(x.subtotal||0),0)),
   items:L.map(x=>{const pesable=/^(lb|kg)$/.test(x.unit);return {n:x.name,cant:pesable?Math.ceil(x.unitsNeeded*2)/2:Math.max(1,Math.ceil(x.unitsNeeded-0.05)),unidad:unidadTxt(x.unit),sub:Math.round(x.subtotal||0)}})}});
 let rutina=[];
 try{const EX=w.eval('EXERCISES'),r=w.buildPersonalizedRoutine(dias,goal,'completo',60);
  rutina=r.map(x=>({titulo:String(x.label||'').replace(/^Día \d+ · /,''),ejercicios:(x.items||(x.ids||[]).map(id=>({id}))).map(it=>{const e=EX.find(z=>z.id===it.id)||{},p=it.prescription||{};const fn=String(e.img||'').match(/(\d+)\.(jpe?g|png)$/i);return {id:it.id,n:e.name||it.id,s:p.sets||3,r:p.reps||'10-12',d:p.rest||'',m:e.muscles||'',fn:fn?fn[1]+'.'+fn[2]:''}})}))}catch(e){console.warn('rutina',e)}
 aviso('Preparando las fotos…');
 try{await prepararFotos(w,diasPlan,rutina)}catch(e){console.warn('fotos',e)}
 const resumen={kcal:Math.round(P.calorieTarget),p:Math.round(P.proteinTarget),c:Math.round(P.carbTarget),g:Math.round(P.fatTarget),tdee:Math.round(P.tdee),
  costoMes:Math.round(P.totalCost||0),moneda:monedaDe(w,d.pais),precios:(()=>{const o={};try{Object.keys(FOODS).forEach(id=>{if(P.priceSet&&P.priceSet[id]!=null)o[id]=P.priceSet[id]})}catch(e){}return o})(),kcalEntreno:Math.round(P.trainingDayCalories||0),kcalDescanso:Math.round(P.restDayCalories||0),generado:new Date().toISOString()};
 aviso('Guardando…');
 const plan={cliente_id:c.id,kcal:resumen.kcal,dias:diasPlan,compras,rutina,resumen};
 await guardarPlanServidor(c,plan);
 planReal[c.id]=plan;
 nutri[c.id]={kcal:resumen.kcal,tdee:resumen.tdee,p:resumen.p,c:resumen.c,g:resumen.g};
 log(c,'plan',`Plan de COME PRO generado: ${fmt(resumen.kcal)} kcal/día · compras ${resumen.moneda}${fmt(resumen.costoMes)} al mes`);
 try{motorFrame.remove();motorFrame=null}catch(e){}
 return plan;
}
/* El plan se lee y se guarda por el Worker (con la clave de servicio de Supabase).
   Así no depende de los permisos de Supabase en el navegador, que podían bloquear la lectura
   o la actualización EN SILENCIO (sin dar error), y por eso el plan "desaparecía" al recargar. */
const diagPlan={};
async function cargarPlanReal(c){
 if(planReal[c.id]!==undefined)return planReal[c.id];
 const okPlan=x=>x&&x.resumen&&Array.isArray(x.dias)&&x.dias.length;
 let plan=null;const dg={};
 try{const j=await llamarWorker('/plan?cliente_id='+encodeURIComponent(c.id));dg.worker=j.filas||[];if(okPlan(j.plan))plan=j.plan}
 catch(e){dg.workerError=e.message}
 if(!plan){ // respaldo: directo a Supabase
  const {data,error}=await sb.from('planes').select('kcal,dias,compras,rutina,resumen').eq('cliente_id',c.id);
  dg.supabase=error?('error: '+error.message):((data||[]).length+' filas');
  const buenas=(data||[]).filter(okPlan).sort((a,b)=>String(b.resumen.generado||'').localeCompare(String(a.resumen.generado||'')));
  plan=buenas[0]||null;
 }
 diagPlan[c.id]=dg;planReal[c.id]=plan;return plan;
}
async function guardarPlanServidor(c,plan){
 // 1) Por el Worker, que además confirma leyendo el plan otra vez
 try{const j=await llamarWorker('/plan','POST',{cliente_id:c.id,plan});if(j.ok)return true}
 catch(e){if(workerApi>=5)throw new Error('No se pudo guardar el plan: '+e.message)}
 // 2) Respaldo (Worker antiguo): Supabase directo, y se comprueba leyendo de nuevo
 const {data:existe}=await sb.from('planes').select('cliente_id').eq('cliente_id',c.id);
 const {error}=existe&&existe.length?await sb.from('planes').update(plan).eq('cliente_id',c.id):await sb.from('planes').insert(plan);
 if(error)throw new Error('No se pudo guardar el plan: '+error.message);
 const {data:ver}=await sb.from('planes').select('dias').eq('cliente_id',c.id);
 if(!(ver||[]).some(x=>Array.isArray(x.dias)&&x.dias.length===plan.dias.length))
  throw new Error('Supabase no dejó guardar el plan (permisos). Sube el worker.js nuevo y corre telegram.sql.');
 return true;
}
/* Versión del Worker publicada: si es vieja, se avisa arriba en el panel */
const PANEL_VERSION='2026-10-31c';
let workerApi=0;
async function revisarWorker(){
 try{const t=await (await fetch(WORKER+'/?v='+Date.now())).text();const m=t.match(/api (\d+)/);workerApi=m?+m[1]:0}catch(e){workerApi=-1}
 if(workerApi>=0&&workerApi<5){const v=document.getElementById('avisoWorker');if(!v){const d=document.createElement('div');d.id='avisoWorker';d.setAttribute('role','alert');
  d.style.cssText='position:sticky;top:0;z-index:50;margin:0 0 10px;padding:12px 14px;border-radius:12px;background:var(--bad-soft,#fbe6e6);color:var(--bad,#c94848);font-weight:700;font-size:14px';
  d.textContent='El Worker publicado en Cloudflare es una versión anterior. Sube el worker.js nuevo al repo come-pro-coach-worker: sin él no se guardan los planes ni responde la IA.';
  document.body.prepend(d)}}
}

  sh.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{sel=b.dataset.n;pintar()});

function grafica(c){

  <polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

function abrirCambio(c,k,f,orig){
 const clave=Object.keys(sustitutos).find(s=>f.toLowerCase().includes(s));
 const ops=clave?sustitutos[clave]:generico;
 let alcance='hoy',elegido=null;
 const sh=$('#sheet');
 const pintar=()=>{sh.innerHTML=`<h3>Cambiar ${f}</h3><p class="sub">La lista de compras y las calorías se ajustan solas.</p>
  <div class="seg">${[['hoy','Solo hoy'],['plan','Todo el plan'],['nunca','No le gusta']].map(([v,t])=>`<button data-a="${v}" class="${alcance===v?'on':''}">${t}</button>`).join('')}</div>
  ${ops.map((o,i)=>`<button class="opt ${elegido===i?'on':''}" data-o="${i}"><span><b>${o[0]}</b><small>${o[1]}</small></span><span>${elegido===i?'✓':''}</span></button>`).join('')}
  <button class="primary" id="aplicar" ${elegido===null?'disabled':''}>Aplicar cambio</button>`;
  sh.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{alcance=b.dataset.a;pintar()});
  sh.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{elegido=+b.dataset.o;pintar()});
  $('#aplicar').onclick=()=>{
   const a=aj(c.id),nuevo=ops[elegido][0];
   if(alcance==='hoy')a.dia[k]=nuevo;else a.plan[orig]=nuevo;
   if(alcance==='nunca'&&clave&&!a.excl.includes(clave))a.excl.push(clave);
   log(c,'plan',alcance==='hoy'?`Día ${k.split('-')[0]}: ${f} → ${nuevo}`:alcance==='plan'?`Todo el plan: ${orig} → ${nuevo}`:`No le gusta: ${orig}. Reemplazado por ${nuevo}`);
   if(c.alerta&&c.alerta.t==='Pidió un cambio')c.alerta=null;
   cerrar();renderCliente(c);
   toast(alcance==='hoy'?'Cambiado solo para hoy':alcance==='plan'?'Cambiado en los 30 días. Lista de compras actualizada.':'Excluido para siempre. Lista de compras actualizada.');
  };
 };
 pintar();$('#sheetBg').style.display='block';requestAnimationFrame(()=>sh.classList.add('open'));
}

// Las fotos se convierten a JPEG liviano antes de subir: evita problemas con HEIC del iPhone y con fotos pesadas
async function aJpeg(f){
 if(!/^image\//.test(f.type)||f.type==='image/gif')return f;
 try{
  const url=URL.createObjectURL(f);
  const img=await new Promise((ok,mal)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=mal;i.src=url});
  const max=1800,k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
  const b=await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.85));
  return b?new File([b],'certificado.jpg',{type:'image/jpeg'}):f;
 }catch(e){return f}
}

   <div class="btn2">${e.certificado_path?`<button class="ghost" data-cert="${esc(e.certificado_path)}">Ver certificado</button>`:'<span class="ghost" style="opacity:.6">Sin certificado</span>'}${e.instagram?`<a class="ghost" target="_blank" rel="noopener" href="https://instagram.com/${encodeURIComponent(e.instagram)}">Instagram</a>`:e.wa_numero?`<a class="ghost" target="_blank" rel="noopener" href="https://wa.me/${e.wa_numero}">WhatsApp</a>`:''}</div>
   <div class="btn2"><button class="primary" data-aprobar="${e.id}" style="margin:0">Aprobar</button><button class="primary" data-rechazar="${e.id}" style="margin:0;background:var(--bad-soft);color:var(--bad)">Rechazar</button></div></div>`).join('')
  :'<p class="sub" style="margin-top:16px">No hay solicitudes nuevas. Cuando un entrenador se registre, aparecerá aquí.</p>';
 if(admin.vista==='entrenadores')cuerpo=res.length?`<div class="list" style="margin-top:12px">${res.sort((a,b)=>b.total-a.total).map(x=>`<button class="row" data-coach="${x.e.id}"><div class="grow"><div class="name">${esc(x.e.nombre)}</div><div class="meta">${x.total} ${x.total===1?'cliente':'clientes'} · ${x.activos} activos · cobra RD$${fmt(x.cobra)}/mes</div></div><span class="tag ${x.activos?'t-ok':x.total?'t-warn':'t-bad'}">${x.activos?'Activo':x.total?'Sin activos':'Sin clientes'}</span></button>`).join('')}</div>`
  :'<p class="sub" style="margin-top:16px">Todavía no has aprobado entrenadores.</p>';
 if(admin.vista==='rechazados')cuerpo=rech.length?rech.map(e=>`<div class="card" style="margin-top:12px"><b>${esc(e.nombre)}</b><div class="meta">${esc(e.correo||'')}</div>${e.nota_revision?`<p class="hint">Motivo: ${esc(e.nota_revision)}</p>`:''}
   <div class="btn2"><button class="primary" data-aprobar="${e.id}" style="margin:0">Aprobar</button>${e.wa_numero?`<a class="ghost" target="_blank" rel="noopener" href="https://wa.me/${e.wa_numero}?text=${encodeURIComponent(`Hola ${e.nombre.split(' ')[0]}, revisamos tu solicitud de COME PRO Coach. Entra en https://coach.come-pro.com para ver qué falta y enviarla de nuevo.`)}">Avisarle</a>`:''}</div></div>`).join('')
  :'<p class="sub" style="margin-top:16px">No hay solicitudes rechazadas.</p>';
 const totCli=clis.length,actCli=clis.filter(c=>c.estado==='activo').length;
 view.innerHTML=cabecera()+`<h1>Administración</h1>
 <div class="kgrid">
  ${k('Solicitudes nuevas',pend.length,pend.length?'Esperan tu revisión':'Al día')}
  ${k('Entrenadores',apro.length,`${activosCoach} con clientes activos`)}
  ${k('Clientes',totCli,`${actCli} activos`)}
  ${k('Tu ingreso estimado','RD$'+fmt(res.reduce((a,x)=>a+x.tuyo,0)),`RD$${TARIFA} por cliente, ${GRATIS} gratis por coach`)}
 </div>
 <div class="seg">${vistas.map(([v,t])=>`<button data-av="${v}" class="${admin.vista===v?'on':''}">${t}</button>`).join('')}</div>
 ${cuerpo}
 <h2>Respaldo</h2><div class="card"><p class="sub" style="margin-top:0">Descarga una copia de entrenadores y clientes. Hazlo cada semana mientras uses el plan gratis de Supabase.</p><div class="btn2"><button class="ghost" data-csv="entrenadores">Entrenadores (CSV)</button><button class="ghost" data-csv="clientes">Clientes (CSV)</button></div></div>`;
 view.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{admin.vista=b.dataset.av;pintarAdmin()});
 view.querySelectorAll('[data-csv]').forEach(b=>b.onclick=()=>descargarCSV(b.dataset.csv));
 view.querySelectorAll('[data-coach]').forEach(b=>b.onclick=()=>{admin.filtroCli='todos';renderAdminCoach(b.dataset.coach);window.scrollTo(0,0)});
 accionesAdmin();
}
function descargarCSV(tipo){
 const filas=tipo==='entrenadores'
  ?admin.ents.map(e=>({nombre:e.nombre,correo:e.correo,whatsapp:e.wa_numero,estado:e.estado_cuenta,certificacion:e.certificacion,experiencia:e.experiencia,clientes_online_dijo:e.clientes_online,instagram:e.instagram,link:e.slug,clientes:admin.clis.filter(c=>c.entrenador_id===e.id).length,registrado:e.creado}))
  :admin.clis.map(c=>{const d=c.datos||{},e=admin.ents.find(x=>x.id===c.entrenador_id)||{};return {entrenador:e.nombre,cliente:limpiar(c.nombre),whatsapp:c.whatsapp,telegram:c.telegram_chat_id?'conectado':'no',codigo:c.codigo,estado:c.estado,plan:planNom(c.plan_tipo),precio:precioCli(c,e),pago:d.pago||'Pendiente',objetivo:d.obj,sexo:d.sexo,edad:d.edad,altura:d.altura,peso_inicial:(d.pesos||[])[0],actividad:d.act,dias_entreno:d.dias,condicion:d.cond,no_come:d.no,registrado:c.creado,ultima_respuesta:c.ultima_respuesta}});
 if(!filas.length){toast('No hay datos para descargar');return}
 const cols=Object.keys(filas[0]),q=v=>{const t=v==null?'':String(v);return /[",\n;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
 const csv='\ufeff'+[cols.join(','),...filas.map(f=>cols.map(k=>q(f[k])).join(','))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download=`come-pro-${tipo}-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Respaldo descargado')
}
function accionesAdmin(){
 view.querySelectorAll('[data-cert]').forEach(b=>b.onclick=async()=>{const w=window.open('','_blank');const {data:u,error:er}=await sb.storage.from('certificados').createSignedUrl(b.dataset.cert,600);if(er||!u){if(w)w.close();toast('No se pudo abrir: '+(er?er.message:''));return}if(w)w.location=u.signedUrl;else location.href=u.signedUrl});
 const cambiar=async(id,estado,nota)=>{const {error:er}=await sb.rpc('revisar_entrenador',{p_id:id,p_estado:estado,p_nota:nota||null});if(er){toast('No se guardó: '+er.message);return}
  const e=admin.ents.find(x=>x.id===id);if(e){e.estado_cuenta=estado;e.nota_revision=nota||null}
  coach.pendientes=admin.ents.filter(x=>x.estado_cuenta==='pendiente').length;
  if(estado==='aprobado'&&e&&e.wa_numero){toast('Aprobado');if(confirm(`¿Avisarle a ${e.nombre.split(' ')[0]} por WhatsApp que ya puede entrar?`))window.open(`https://wa.me/${e.wa_numero}?text=${encodeURIComponent(`Hola ${e.nombre.split(' ')[0]}, tu cuenta de COME PRO Coach fue aprobada ✅. Ya puedes entrar en https://coach.come-pro.com y agregar tus clientes.`)}`,'_blank')}
  else toast(estado==='aprobado'?'Aprobado':'Listo');
  if(admin.coachAbierto&&estado!=='aprobado'){admin.coachAbierto=null;admin.vista='rechazados'}
  pintarAdmin();window.scrollTo(0,0)};
 view.querySelectorAll('[data-aprobar]').forEach(b=>b.onclick=()=>cambiar(b.dataset.aprobar,'aprobado'));
 view.querySelectorAll('[data-rechazar]').forEach(b=>b.onclick=()=>{const m=prompt('¿Por qué no se aprueba? El entrenador verá este mensaje.','El certificado no se ve claro. Sube una foto donde se lea tu nombre y la institución.');if(m===null)return;if(!m.trim()){toast('Escribe el motivo');return}cambiar(b.dataset.rechazar,'rechazado',m.trim())});
 view.querySelectorAll('[data-suspender]').forEach(b=>b.onclick=()=>{const m=prompt('Motivo de la suspensión. El entrenador lo verá y no podrá usar el panel hasta que lo apruebes de nuevo.','');if(m===null)return;if(!m.trim()){toast('Escribe el motivo');return}cambiar(b.dataset.suspender,'rechazado',m.trim())});
}
function renderAdminCoach(id){
 const e=admin.ents.find(x=>x.id===id);if(!e){pintarAdmin();return}
 admin.coachAbierto=id;
 const x=resumenCoach(e,admin.clis),f=(l,v)=>`<div><small>${l}</small>${esc(v==null||v===''?'—':v)}</div>`;
 const k=(t,v,sub)=>`<div class="card"><small>${t}</small><b>${v}</b>${sub?`<div class="meta">${sub}</div>`:''}</div>`;
 const estLbl={activo:['Activo','t-ok'],pendiente:['Sin activar','t-warn'],revision:['Plan por revisar','t-warn'],pausado:['Pausado','t-bad']};
 const fs=[['todos','Todos',()=>true],['activo','Activos',c=>c.estado==='activo'],['sin','Sin empezar',c=>c.estado==='pendiente'||c.estado==='revision'],['pausado','Pausados',c=>c.estado==='pausado']];
 const lista=x.mios.filter((fs.find(z=>z[0]===admin.filtroCli)||fs[0])[2]);
 const cli=c=>{const d=c.datos||{},n=d.nutri||{},seg=(c.seguimiento||[]).filter(z=>z.hecho!=null),
   pesos=(c.seguimiento||[]).filter(z=>z.peso!=null).sort((a,b)=>a.fecha<b.fecha?-1:1).map(z=>+z.peso),
   pl=Array.isArray(c.planes)?c.planes[0]:c.planes,kcal=(pl&&pl.kcal)||n.kcal,est=estLbl[c.estado]||[c.estado,'t-warn'],
   cambios=d.ajustes?Object.keys(d.ajustes.dia||{}).length+Object.keys(d.ajustes.plan||{}).length:0,hist=(d.historial||[]).slice(0,5);
   return `<details class="card" style="margin-top:10px"><summary style="display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none">
   <div><b>${esc(limpiar(c.nombre))}</b><div class="meta">${planNom(c.plan_tipo)} · RD$${fmt(precioCli(c,e))} · ${esc(d.pago||'Pendiente')}</div></div><span class="tag ${est[1]}">${est[0]}</span></summary>
   <h3 class="rday" style="margin-top:14px">Plan</h3><div class="ck dgrid">
   ${f('Tipo de plan',planNom(c.plan_tipo))}${f('Precio',`RD$${fmt(precioCli(c,e))}/mes`)}
   ${f('Pago',d.pago||'Pendiente')}${f('Vence',d.vence)}
   ${f('Calorías',kcal?fmt(kcal)+' kcal':'')}${f('Proteína / carbos / grasa',n.p?`${n.p} / ${n.c} / ${n.g} g`:'')}
   ${f('Rutina',c.envia_rutina===false?'No se envía':(d.dias?d.dias+' días por semana':'Sí'))}${f('Cambios hechos al plan',String(cambios))}</div>
   <h3 class="rday">Cliente</h3><div class="ck dgrid">
   ${f('Telegram',c.telegram_chat_id?'Conectado'+(c.telegram_usuario?' (@'+c.telegram_usuario+')':''):'Sin abrir el bot')}${f('WhatsApp',c.whatsapp?fmtTel(c.whatsapp):'')}${f('Código',c.codigo)}
   ${f('Objetivo',limpiar(d.obj))}${f('Sexo y edad',(d.sexo==='h'?'Hombre':d.sexo==='m'?'Mujer':'—')+(d.edad?', '+d.edad+' años':''))}
   ${f('Altura',d.altura?d.altura+' cm':'')}${f('Peso inicial → actual',`${(d.pesos&&d.pesos[0])||'—'} → ${pesos.length?pesos.at(-1):'—'} kg`)}
   ${f('Actividad',actLbl[d.act]||d.act)}${f('Condición de salud',condLbl[d.cond]||d.cond)}
   ${f('No come',limpiar(d.no))}${f('Cumplimiento',seg.length?Math.round(seg.filter(z=>z.hecho).length/seg.length*100)+'%':'Sin datos')}
   ${f('Registro',(d.origen==='link'?'Por el link':'Lo agregó el coach')+' · '+new Date(c.creado).toLocaleDateString('es-DO',{day:'numeric',month:'short'}))}${f('Última respuesta',c.ultima_respuesta?new Date(c.ultima_respuesta).toLocaleDateString('es-DO',{day:'numeric',month:'short'}):'Nunca')}</div>
   ${hist.length?`<h3 class="rday">Últimos movimientos</h3><ol class="hist">${hist.map(h=>`<li><span class="hdot h-${esc(h.tipo)}"></span><div><div>${esc(h.texto)}</div><div class="meta">${esc(h.f)}</div></div></li>`).join('')}</ol>`:''}
   </details>`};
 view.innerHTML=`<button class="back" id="back">‹ Administración</button>
 <h1>${esc(e.nombre)}</h1><p class="sub">${esc(e.correo||'')}${e.wa_numero?' · '+fmtTel(e.wa_numero):''}</p>
 <div class="summary" style="margin-top:10px"><span class="tag t-ok">${x.mios.filter(z=>z.telegram_chat_id).length} en Telegram</span><span class="tag t-ok">Desde ${new Date(e.creado).toLocaleDateString('es-DO',{day:'numeric',month:'short',year:'numeric'})}</span></div>
 <div class="kgrid">
  ${k('Clientes',x.total,`${x.activos} activos · ${x.sin} sin empezar · ${x.pausados} pausados`)}
  ${k('Cobra a sus clientes','RD$'+fmt(x.cobra),'al mes, sin contar pausados')}
  ${k('Le han pagado','RD$'+fmt(x.cobrado),'marcado como pagado')}
  ${k('Te paga a ti','RD$'+fmt(x.tuyo),`${GRATIS} clientes gratis, RD$${TARIFA} los demás`)}
 </div>
 <details class="card"><summary style="cursor:pointer;list-style:none;display:flex;justify-content:space-between"><b>Perfil del entrenador</b><span class="chev">⌄</span></summary>
 <div class="ck dgrid" style="margin-top:12px">${f('Certificación',e.certificacion)}${f('Experiencia',e.experiencia)}${f('Clientes online (dijo)',e.clientes_online)}${f('Instagram',e.instagram?'@'+e.instagram:'')}${f('Link de registro','coach.come-pro.com/registro.html?e='+e.slug)}${f('Precios',['ali','full','pres'].map(t=>planNom(t).split(' ')[0]+' RD$'+fmt((e.config&&e.config.precios&&e.config.precios[t])||precioBase[t])).join(' · '))}</div>
 <div class="btn2">${e.certificado_path?`<button class="ghost" data-cert="${esc(e.certificado_path)}">Ver certificado</button>`:''}${e.wa_numero?`<a class="ghost" target="_blank" rel="noopener" href="https://wa.me/${e.wa_numero}">Escribirle</a>`:''}</div>
 ${coach.admin&&e.id!==yo.id?`<button class="linkbtn" data-suspender="${e.id}" style="color:var(--bad);margin-top:10px">Suspender cuenta</button>`:''}</details>
 <h2>Sus clientes</h2>
 ${x.total?`<div class="summary" style="margin-top:0">${fs.map(([v,t,fn])=>`<button class="chip ${admin.filtroCli===v?'on':''}" data-fc="${v}">${t} ${x.mios.filter(fn).length}</button>`).join('')}</div>
 ${lista.map(cli).join('')||'<p class="sub">Ninguno en este grupo.</p>'}
 <p class="hint">Solo lectura. Úsalo para dar soporte; los clientes son del entrenador.</p>`:'<p class="sub">Todavía no tiene clientes.</p>'}`;
 $('#back').onclick=()=>{admin.coachAbierto=null;admin.vista='entrenadores';pintarAdmin();window.scrollTo(0,0)};
 view.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>{admin.filtroCli=b.dataset.fc;renderAdminCoach(id)});
 accionesAdmin();
}
sb.auth.onAuthStateChange((ev,ses)=>{
 if(ev==='SIGNED_IN'&&ses)entrar(ses.user);
 if(ev==='PASSWORD_RECOVERY'){const p=prompt('Escribe tu nueva contraseña (mínimo 8 caracteres)');if(p&&p.length>=8)sb.auth.updateUser({password:p}).then(({error})=>toast(error?error.message:'Contraseña cambiada'))}
});
(async()=>{
 if(SUPABASE_KEY.startsWith('PEGA_')){document.querySelector('nav.tabs').style.display='none';view.innerHTML='<h1>Falta la clave</h1><p class="sub">Pega la Publishable key de Supabase en la línea <b>SUPABASE_KEY</b> de este archivo.</p>';return}
 const {data}=await sb.auth.getSession();
 if(data.session){entrar(data.session.user)}else pantallaLogin();
})();
</script>
