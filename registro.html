<style>
:root{
 --bg:#f4f5f3;--surface:#fff;--soft:#f4f8ef;--ink:#171a1d;--muted:#6b7379;--line:#e2e6e1;

 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#05070a;--surface:#0d120e;--soft:#16240f;--ink:#f5f8f1;--muted:#aab4a6;--line:#273127;
 --brand:#9be83f;--brand-text:#9be83f;--bad:#ef7a7a;--bad-soft:#2e1414;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:460px;margin:0 auto;padding:28px 20px 40px}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--muted)}
.marca i{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:22px 0 8px;font-weight:800}
.sub{color:var(--muted);margin:0}
.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:24px 0 6px}
.pasos span{height:5px;border-radius:5px;background:var(--line);transition:background .25s}
.pasos span.on{background:var(--brand)}
.paso-txt{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
label,.lbl{display:block;font-weight:700;font-size:15px;margin:18px 0 7px}
input[type=text],input[type=tel],input[type=number]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ayuda{font-size:13px;color:var(--muted);margin:6px 0 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 label{margin-top:18px}
.ops{display:grid;gap:8px}
.ops.fila{grid-auto-flow:column;grid-auto-columns:1fr}
.ops button{font:inherit;font-weight:600;font-size:15px;padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer}
.ops.fila button{text-align:center}
.ops button small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.ops button[aria-pressed=true]{border-color:var(--brand);background:var(--soft);box-shadow:inset 0 0 0 1px var(--brand)}
.acepto{display:flex;gap:12px;align-items:flex-start;margin-top:22px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:14px;cursor:pointer}
.acepto input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--brand)}
.error{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:14px}
.botones{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:26px}
.btn{font:inherit;font-weight:800;font-size:16px;padding:15px 20px;border-radius:999px;border:0;background:var(--brand);color:var(--on-brand);cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.6}
.oculto{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.listo{text-align:left}
.listo .check{width:64px;height:64px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;margin-top:30px}
.caja{margin-top:20px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.codigo{font-size:22px;font-weight:800;letter-spacing:.02em;margin-top:4px}
select{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.tel{display:flex;gap:8px;align-items:stretch}
.tel span{display:grid;place-items:center;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-weight:700;font-size:16px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fila-u{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.fila-u label{margin-bottom:7px}
.unid{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:7px;flex:none}
.unid button{font:inherit;font-weight:700;font-size:13px;padding:6px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.unid button[aria-pressed=true]{background:var(--brand);color:var(--on-brand)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const t=k=>(T[L]&&T[L][k]!==undefined?T[L][k]:T.es[k]);
function nombrePais(p){try{return new Intl.DisplayNames([L],{type:'region'}).of(p[0])}catch(e){return L==='es'?p[1]:p[2]}}
function dialDe(code){const p=PAISES.find(x=>x[0]===code);return p?p[3]:'1'}
function imperial(){return IMPERIAL.includes(d.pais)}

function opciones(campo,ops,fila){
 return `<div class="ops ${fila?'fila':''}" role="group" data-campo="${campo}">${ops.map(([v,tx,s])=>`<button type="button" data-v="${v}" aria-pressed="${d[campo]===v}">${tx}${s?`<small>${s}</small>`:''}</button>`).join('')}</div>`;
}
function unidad(campo,ops){return `<span class="unid" role="group" data-unidad="${campo}">${ops.map(([v,tx])=>`<button type="button" data-v="${v}" aria-pressed="${d[campo]===v}">${tx}</button>`).join('')}</span>`}
function cabeza(){
 return `<div class="marca"><i>CP</i>COME PRO Coach</div>
 <h1>${esc(t('titulo')(primer(entrenador)))}</h1>
 <p class="sub">${t('sub')}</p>
 <div class="pasos" aria-hidden="true">${[1,2,3].map(n=>`<span class="${n<=paso?'on':''}"></span>`).join('')}</div>
 <div class="paso-txt">${t('paso')(paso)}</div>`;
}
function guardarCampos(){
 app.querySelectorAll('input[id],select[id]').forEach(i=>{d[i.id]=i.type==='checkbox'?i.checked:i.value});
}
function pintar(error){
 document.documentElement.lang=L;
 let cuerpo='';
 if(paso===1){
  const lista=PAISES.map(p=>[p,nombrePais(p)]).sort((a,b)=>a[1].localeCompare(b[1],L));
  cuerpo=`
  <label for="nombre">${t('nombre')}</label><input type="text" id="nombre" autocomplete="name" value="${esc(d.nombre||'')}">
  <label for="pais">${t('pais')}</label><select id="pais">${lista.map(([p,n])=>`<option value="${p[0]}" ${d.pais===p[0]?'selected':''}>${esc(n)}</option>`).join('')}</select>
  <p class="ayuda">${t('paisAyuda')}</p>
  <label for="whatsapp">${t('tel')}</label><div class="tel"><span id="prefijo">+${dialDe(d.pais)}</span><input type="tel" id="whatsapp" inputmode="tel" autocomplete="tel-national" placeholder="${t('telPh')}" value="${esc(d.whatsapp||'')}"></div>
  <p class="ayuda">${t('telAyuda')}</p>
  <label for="telegram">${t('tgU')} <span style="font-weight:400">${t('opc')}</span></label><input type="text" id="telegram" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="${t('tgPh')}" value="${esc(d.telegram||'')}">
  <p class="ayuda">${t('tgAyuda')}</p>
  <span class="lbl">${t('sexo')}</span>${opciones('sexo',[['m',t('mujer')],['h',t('hombre')]],true)}
  <div class="oculto" aria-hidden="true"><input type="text" id="web" tabindex="-1" autocomplete="off"></div>`;
 }
 if(paso===2){
  if(!d.uPeso)d.uPeso=imperial()?'lb':'kg';
  if(!d.uAlt)d.uAlt=imperial()?'ft':'cm';
  const alt=d.uAlt==='ft'
   ?`<div class="grid2"><input type="number" id="pies" inputmode="numeric" aria-label="${t('pies')}" placeholder="${t('pies')}" value="${esc(d.pies||'')}"><input type="number" id="pulg" inputmode="numeric" aria-label="${t('pulg')}" placeholder="${t('pulg')}" value="${esc(d.pulg||'')}"></div>`
   :`<input type="number" id="altura" inputmode="numeric" placeholder="cm" value="${esc(d.altura||'')}">`;
  cuerpo=`
  <label for="edad">${t('edad')}</label><input type="number" id="edad" inputmode="numeric" value="${esc(d.edad||'')}">
  <div class="fila-u"><label for="peso">${t('peso')}</label>${unidad('uPeso',[['kg','kg'],['lb','lb']])}</div><input type="number" id="peso" inputmode="decimal" step="0.1" placeholder="${d.uPeso}" value="${esc(d.peso||'')}">
  <div class="fila-u"><label for="${d.uAlt==='ft'?'pies':'altura'}">${t('altura')}</label>${unidad('uAlt',[['cm','cm'],['ft',t('pies')]])}</div>${alt}
  <span class="lbl">${t('objQ')}</span>${opciones('obj',[['grasa',t('obj')[0]],['musculo',t('obj')[1]],['mant',t('obj')[2]]])}
  <span class="lbl">${t('actQ')}</span>${opciones('act',[['sed',t('act')[0]],['lig',t('act')[1]],['mod',t('act')[2]],['alt',t('act')[3]]])}
  <span class="lbl">${t('diasQ')}</span>${opciones('dias',[['2','2'],['3','3'],['4','4'],['5','5']],true)}`;
 }
 if(paso===3)cuerpo=`
  <label for="no">${t('noQ')}</label><input type="text" id="no" placeholder="${t('noPh')}" value="${esc(d.no||'')}">
  <p class="ayuda">${t('noAyuda')}</p>
  <span class="lbl">${t('condQ')}</span>${opciones('cond',[['ninguna',t('cond')[0]],['diabetes',t('cond')[1]],['hta',t('cond')[2]],['embarazo',t('cond')[3]],['otra',t('cond')[4]]])}
  <p class="ayuda">${t('condAyuda')}</p>
  <label class="acepto"><input type="checkbox" id="acepto" ${d.acepto?'checked':''}><span>${t('acepto')(primer(entrenador))}</span></label>`;
 app.innerHTML=cabeza()+cuerpo+(error?`<p class="error" role="alert">${esc(error)}</p>`:'')+
  `<div class="botones" style="${paso===1?'grid-template-columns:1fr':''}">${paso>1?`<button type="button" class="btn sec" id="atras">${t('atras')}</button>`:''}<button type="button" class="btn" id="seguir">${paso<3?t('seguir'):t('enviar')}</button></div>`;
 app.querySelectorAll('.ops').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{d[g.dataset.campo]=b.dataset.v;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))}));
 app.querySelectorAll('[data-unidad]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{guardarCampos();d[g.dataset.unidad]=b.dataset.v;pintar()}));
 const sel=document.getElementById('pais');
 if(sel)sel.onchange=()=>{guardarCampos();d.uPeso='';d.uAlt='';const pre=document.getElementById('prefijo');if(pre)pre.textContent='+'+dialDe(d.pais)};
 const atras=document.getElementById('atras');if(atras)atras.onclick=()=>{guardarCampos();paso--;pintar();scrollTo(0,0)};
 document.getElementById('seguir').onclick=seguir;
 if(error)app.querySelector('.error').scrollIntoView({block:'center'});
}
// Número completo con código de país (como lo tiene Telegram)
function telCompleto(){
 const crudo=String(d.whatsapp||'').trim(),dig=crudo.replace(/\D/g,''),dial=dialDe(d.pais);
 if(crudo.startsWith('+')||crudo.startsWith('00'))return dig.replace(/^00/,'');
 if(dig.startsWith(dial)&&dig.length>=dial.length+8)return dig;
 return dial+dig.replace(/^0+/,'');
}
function medidas(){
 const kg=d.uPeso==='lb'?(+d.peso)/2.2046:+d.peso;
 const cm=d.uAlt==='ft'?(+d.pies||0)*30.48+(+d.pulg||0)*2.54:+d.altura;
 return {kg:Math.round(kg*10)/10,cm:Math.round(cm)};
}
function validar(){
 if(paso===1){
  if(String(d.nombre||'').trim().length<2)return t('eNombre');
  if(!d.pais)return t('ePais');
  const tel=telCompleto();if(!(tel.length>=10&&tel.length<=15)||String(d.whatsapp||'').replace(/\D/g,'').length<7)return t('eTel');
  const tg=String(d.telegram||'').trim().replace(/^@/,'').replace(/^https?:\/\/t\.me\//i,'');
  if(tg&&!/^[A-Za-z][A-Za-z0-9_]{4,31}$/.test(tg))return t('eTg');
  if(!d.sexo)return t('eSexo');
 }
 if(paso===2){
  const e=+d.edad,m=medidas();
  if(!(e>=16&&e<=90))return t('eEdad');
  if(!(m.kg>=35&&m.kg<=250))return t('ePeso');
  if(!(m.cm>=130&&m.cm<=220))return t('eAlt');
  if(!d.obj)return t('eObj');
  if(!d.act)return t('eAct');
  if(!d.dias)return t('eDias');
 }
 if(paso===3){
  if(!d.cond)return t('eCond');
  if(!d.acepto)return t('eAcepto');
 }
 return '';
}
async function seguir(){
 guardarCampos();
 const err=validar();if(err){pintar(err);return}
 if(paso<3){paso++;pintar();scrollTo(0,0);return}
 const b=document.getElementById('seguir');b.disabled=true;b.textContent=t('enviando');
 const m=medidas();
 try{
  const r=await fetch(WORKER+'/registro',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({e:slug,nombre:d.nombre,whatsapp:'+'+telCompleto(),telegram:String(d.telegram||'').trim(),pais:d.pais,idioma:L,sexo:d.sexo,edad:+d.edad,peso:m.kg,altura:m.cm,obj:d.obj,act:d.act,dias:d.dias,no:d.no||'',cond:d.cond,acepto:d.acepto===true,web:d.web||''})});
  const j=await r.json();
  if(!r.ok){pintar(j.error||t('eEnvio'));return}
  listo(j);
 }catch(e){pintar(t('eRed'))}
}
function listo(j){
 const n=primer(d.nombre),ent=primer(j.entrenador||entrenador);
 const tg=j.tg&&/^https:\/\/t\.me\//.test(j.tg)?j.tg:'';
 app.innerHTML=`<div class="listo"><div class="marca"><i>CP</i>COME PRO Coach</div>
 <div class="check" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
 <h1>${t('listo')(n)}</h1>
 <p class="sub">${t('recibio')(ent)}</p>
 ${tg?`<div class="caja"><b>${t('ultimo')}</b><p class="sub" style="margin-top:4px">${t('ultimoTxt')}</p><a class="btn" style="margin-top:14px" href="${esc(tg)}">${t('abrir')}</a><p class="ayuda" style="margin-top:10px">${t('tambien')(esc(tg.split('/').pop().split('?')[0]))}</p></div>`
 :`<div class="caja"><b>${t('queSigue')}</b><p class="sub" style="margin-top:4px">${t('queSigueTxt')(ent)}</p><div class="codigo">${esc(j.codigo)}</div></div>`}
 </div>`;
 scrollTo(0,0);
}
(async()=>{
 d.pais=paisTelefono();
 app.innerHTML=`<p class="sub" style="padding-top:30vh;text-align:center">${t('cargando')}</p>`;
 if(!slug){app.innerHTML=`<h1>${t('linkInc')}</h1><p class="sub">${t('linkIncTxt')}</p>`;return}
 try{
  const r=await fetch(WORKER+'/registro?e='+encodeURIComponent(slug)),j=await r.json();
  if(!r.ok){app.innerHTML=`<h1>${t('linkMal')}</h1><p class="sub">${esc(j.error)}</p>`;return}
  entrenador=j.nombre;document.title=t('tit')(entrenador.split(' ')[0]);pintar();
 }catch(e){app.innerHTML=`<h1>${t('sinRed')}</h1><p class="sub">${t('sinRedTxt')}</p>`}
})();
</script>
